<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07152C;--line:#1D4566;--text:#FFFFFF;--muted:#9FB3C8;--accent:#17C3B2;--danger:#FF7A7A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07152C 0%,#0B1E3D 60%,#0F4A5C 100%);
       color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55}
  main{max-width:1150px;margin:0 auto;padding:48px 24px 64px}
  h1,h2,h3{font-family:"Space Grotesk",Arial,sans-serif;margin:0}
  header h1{font-size:clamp(32px,5vw,48px);line-height:1.1}
  header p{color:var(--muted);margin:12px 0 0;max-width:60ch}
  form{display:flex;gap:12px;margin-top:32px;max-width:720px}
  input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:14px 16px;font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{padding:14px 22px;border:0;background:var(--accent);color:var(--bg);font-family:"Space Grotesk",Arial,sans-serif;
         font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.5;cursor:wait}
  .status{min-height:24px;margin-top:12px;font-size:14px;color:var(--muted)}
  .status.error{color:var(--danger)}
  .grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;margin-top:24px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  aside,article{background:rgba(255,255,255,.05);padding:24px}
  aside h2{font-size:16px;margin-bottom:12px;color:var(--muted);font-weight:500}
  aside ul{list-style:none;margin:0;padding:0}
  aside li button{all:unset;display:block;width:100%;padding:8px 0;cursor:pointer;border-top:1px solid var(--line);font-size:15px}
  aside li:first-child button{border-top:0}
  aside li button:hover,aside li button.active{color:var(--accent)}
  aside small{display:block;color:var(--muted);font-size:12px}
  article h2{font-size:30px}
  .lead{color:var(--muted);margin:6px 0 20px;max-width:70ch}
  .facts{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;color:var(--muted);margin-bottom:8px}
  .facts b{color:var(--text);font-weight:500}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 32px}
  @media (max-width:640px){.cols{grid-template-columns:1fr}}
  h3{font-size:16px;color:var(--accent);margin:22px 0 6px}
  article ul{margin:0;padding-left:18px}
  article li{margin:4px 0}
  .opener{margin-top:24px;padding:18px 20px;background:var(--accent);color:var(--bg)}
  .opener h3{color:var(--bg);margin:0 0 4px}
  .sources a{color:var(--muted);font-size:13px;word-break:break-word}
  .note{color:var(--muted);font-size:13px;margin-top:20px}
  .empty{color:var(--muted)}
  footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Sales Research</h1>
    <p>Type a company name. Gemini researches it on the live web and writes a one page brief. Every brief is saved, so the whole team can open it later.</p>
  </header>

  <form id="form">
    <input id="company" placeholder="Company name, for example Mamaearth" autocomplete="off">
    <button id="go">Research</button>
  </form>
  <div class="status" id="status"></div>

  <div class="grid">
    <aside>
      <h2>Researched so far</h2>
      <ul id="history"><li class="empty">Loading...</li></ul>
    </aside>
    <article id="brief"><p class="empty">Your brief will appear here.</p></article>
  </div>

  <footer>Code on GitHub. Live on Vercel. Data in Supabase. Research by Gemini.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = a => Array.isArray(a) && a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="empty">Not found</p>';
let activeId = null;

function setStatus(msg, isError = false) {
  $('status').textContent = msg;
  $('status').className = 'status' + (isError ? ' error' : '');
}

function showBrief(row) {
  activeId = row.id;
  const b = row.brief || {};
  const src = (row.sources || []).map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('');
  $('brief').innerHTML = `
    <h2>${esc(b.company || row.company)}</h2>
    <p class="lead">${esc(b.one_liner)}</p>
    <div class="facts">
      <span><b>Sector</b> ${esc(b.sector)}</span>
      <span><b>HQ</b> ${esc(b.headquarters)}</span>
      <span><b>Founded</b> ${esc(b.founded)}</span>
    </div>
    <div class="cols">
      <div><h3>Size signals</h3>${list(b.size_signals)}</div>
      <div><h3>Key people</h3>${list(b.key_people)}</div>
      <div><h3>Recent news</h3>${list(b.recent_news)}</div>
      <div><h3>Likely challenges</h3>${list(b.likely_challenges)}</div>
    </div>
    <h3>How we could help</h3>${list(b.how_we_could_help)}
    <div class="opener"><h3>Suggested opening line</h3>${esc(b.opening_line)}</div>
    ${src ? `<h3>Sources Gemini used</h3><ul class="sources">${src}</ul>` : ''}
    <p class="note">AI generated from public web sources on ${new Date(row.created_at).toLocaleDateString()}. Check figures before using them with a client.</p>`;
  document.querySelectorAll('#history button').forEach(btn => btn.classList.toggle('active', Number(btn.dataset.id) === activeId));
}

async function loadHistory() {
  try {
    const res = await fetch('/api/research');
    const rows = await res.json();
    if (!res.ok) throw new Error(rows.error);
    $('history').innerHTML = rows.length
      ? rows.map(r => `<li><button data-id="${r.id}" class="${r.id === activeId ? 'active' : ''}">${esc(r.company)}<small>${new Date(r.created_at).toLocaleDateString()}</small></button></li>`).join('')
      : '<li class="empty">Nothing yet.</li>';
  } catch (e) { setStatus(e.message, true); $('history').innerHTML = ''; }
}

$('history').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const res = await fetch(`/api/research?id=${btn.dataset.id}`);
  const row = await res.json();
  if (row) showBrief(row);
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const company = $('company').value.trim();
  if (!company) return setStatus('Type a company name first.', true);
  $('go').disabled = true;
  setStatus(`Gemini is researching ${company} on the web. This takes 15 to 40 seconds...`);
  try {
    const res = await fetch('/api/research', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ company })
    });
    const row = await res.json();
    if (!res.ok) throw new Error(row.error);
    setStatus('Done. Brief saved for the team.');
    $('company').value = '';
    showBrief(row);
    loadHistory();
  } catch (err) { setStatus(err.message, true); }
  finally { $('go').disabled = false; }
});

loadHistory();
</script>
</body>
</html>
